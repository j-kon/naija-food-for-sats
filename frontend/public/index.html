<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Naija Food for sats demo storefront" />
    <title>Naija Food for Sats</title>
    <style>
      :root {
        --bg: #f7f1e3;
        --panel: #fffaf1;
        --ink: #1f1b16;
        --accent: #0d9488;
        --accent-dark: #0f766e;
        --border: #d9c7aa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(245, 158, 11, 0.15), transparent 35%),
          linear-gradient(180deg, #f5e6c8 0%, var(--bg) 100%);
      }

      .page {
        min-height: 100vh;
        padding: 32px 20px 48px;
      }

      .hero {
        max-width: 1000px;
        margin: 0 auto 28px;
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 250, 241, 0.88);
      }

      .eyebrow {
        margin: 0 0 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 0.95;
      }

      .subtitle {
        margin: 16px 0 0;
        max-width: 560px;
        font-size: 18px;
        line-height: 1.5;
      }

      .status {
        margin-top: 18px;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(13, 148, 136, 0.12);
      }

      .grid {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(49, 31, 7, 0.08);
      }

      .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 18px;
      }

      .card h2 {
        margin: 0 0 6px;
        font-size: 28px;
      }

      .price {
        margin: 0 0 14px;
        color: #5b5345;
      }

      .description {
        margin: 0 0 14px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      button,
      .download-link {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        font: inherit;
        text-decoration: none;
      }

      button {
        color: white;
        background: var(--accent);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button:hover:not(:disabled),
      .download-link:hover {
        background: var(--accent-dark);
      }

      textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        font: 13px/1.4 monospace;
        background: #fffdf8;
      }

      .download-row {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .download-link {
        color: white;
        background: #1f2937;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Lightning food demo</p>
        <h1>Naija Food for Sats</h1>
        <p class="subtitle">
          Order a dish, receive an invoice, and unlock the image download after
          payment verification. When a real node is not configured, the app
          falls back to a local mock Lightning flow.
        </p>
        <div class="status">
          <strong>Node:</strong>
          <span id="alias">Loading...</span>
          <strong>Mode:</strong>
          <span id="mode">...</span>
        </div>
      </section>

      <section class="grid" id="menu"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
